<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Administración de Condominios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0B0E14;
      --bg-elevated:#10141C;
      --surface:#141922;
      --surface-2:#1B222E;
      --border:#262E3B;
      --border-soft:#1E2530;
      --text:#EDF0F5;
      --text-dim:#8A93A3;
      --text-faint:#5B6472;
      --gold:#C9A15C;
      --gold-light:#E7C989;
      --gold-soft:rgba(201,161,92,0.14);
      --gold-dim:rgba(201,161,92,0.55);
      --teal:#4FB6A6;
      --teal-light:#7DD4C4;
      --teal-soft:rgba(79,182,166,0.14);
      --amber:#D9A441;
      --amber-soft:rgba(217,164,65,0.14);
      --red:#C4544A;
      --red-soft:rgba(196,84,74,0.14);
      --violet:#8D85D6;
      --violet-light:#B0A9E8;
      --violet-soft:rgba(141,133,214,0.14);
      --surface-hover:#1B2330;
      --radius:14px;
      --radius-sm:9px;
      --shadow:0 10px 30px rgba(0,0,0,0.35);
      --ease:cubic-bezier(.22,.8,.28,1);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
      background:
        radial-gradient(1100px 600px at 85% -10%, rgba(201,161,92,0.06), transparent 60%),
        radial-gradient(900px 500px at -10% 10%, rgba(79,182,166,0.05), transparent 55%),
        var(--bg);
      color:var(--text);
      font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
      min-height:100vh;
      -webkit-font-smoothing:antialiased;
    }
    ::-webkit-scrollbar{width:10px;height:10px;}
    ::-webkit-scrollbar-track{background:transparent;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;}
    ::-webkit-scrollbar-thumb:hover{background:var(--gold-dim);}

    .app{display:flex;flex-direction:column;min-height:100vh;}

    /* ============== TOPNAV (barra superior) ============== */
    .topnav{
      width:100%;
      background:var(--bg-elevated);
      border-bottom:1px solid var(--border-soft);
      display:flex;
      align-items:center;
      gap:22px;
      padding:14px 24px;
      position:sticky;
      top:0;
      z-index:40;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      padding-right:22px;
      border-right:1px solid var(--border-soft);
      flex:0 0 auto;
    }
    .brand-emblem{
      width:40px;height:40px;flex:0 0 40px;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
    }
    .brand-emblem img{width:100%;height:100%;object-fit:contain;}
    .brand-emblem svg{width:22px;height:22px;}
    .brand-text{line-height:1.25;white-space:nowrap;}
    .brand-title{
      font-family:'Fraunces',serif;
      font-size:13.5px;
      font-weight:600;
      letter-spacing:0.01em;
      color:var(--text);
    }
    .brand-sub{
      font-size:10px;
      letter-spacing:0.14em;
      color:var(--gold);
      text-transform:uppercase;
      margin-top:2px;
    }
    .nav-group{
      display:flex;
      align-items:center;
      gap:12px;
      flex:1;
      min-width:0;
    }
    .nav-label{
      font-size:10.5px;
      letter-spacing:0.14em;
      color:var(--text-faint);
      text-transform:uppercase;
      white-space:nowrap;
      flex:0 0 auto;
    }
    .nav-list{
      list-style:none;margin:0;padding:2px 2px;
      display:flex;flex-direction:row;gap:8px;
      overflow-x:auto;overflow-y:hidden;
      flex:1;min-width:0;
    }
    .nav-item{
      display:flex;align-items:center;gap:8px;
      padding:9px 15px;
      border-radius:99px;
      cursor:pointer;
      border:1px solid var(--border);
      background:var(--surface);
      transition:background .15s ease, border-color .15s ease, color .15s ease;
      color:var(--text-dim);
      font-size:13px;
      font-weight:500;
      white-space:nowrap;
      flex:0 0 auto;
    }
    .nav-item:hover{background:var(--surface-2);color:var(--text);transform:translateY(-1px);}
    .nav-item{transition:background .15s ease, border-color .15s ease, color .15s ease, transform .15s ease;}
    .nav-item.active{
      background:var(--gold-soft);
      border-color:rgba(201,161,92,0.4);
      color:var(--gold);
    }
    .nav-dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);flex:0 0 6px;}
    .nav-item.active .nav-dot{background:var(--gold);}
    .nav-item-name{overflow:hidden;text-overflow:ellipsis;}

    .topnav-footer{
      display:flex;
      align-items:center;
      gap:14px;
      font-size:11px;
      color:var(--text-faint);
      flex:0 0 auto;
      white-space:nowrap;
      padding-left:20px;
      border-left:1px solid var(--border-soft);
    }

    /* ============== MAIN ============== */
    .main{flex:1;padding:28px 34px 60px;min-width:0;}

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      margin-bottom:26px;
      padding-bottom:22px;
      border-bottom:1px solid var(--border-soft);
    }
    .topbar-left{display:flex;align-items:center;gap:16px;min-width:0;}
    .condo-logo{
      width:64px;height:64px;flex:0 0 64px;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
    }
    .condo-logo img{width:100%;height:100%;object-fit:contain;}
    .condo-logo svg{width:28px;height:28px;}
    .condo-title-wrap{min-width:0;}
    .eyebrow{
      font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;
      color:var(--text-faint);margin-bottom:5px;
    }
    .condo-title{
      font-family:'Fraunces',serif;
      font-size:26px;font-weight:500;
      color:var(--text);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      max-width:520px;
    }
    .topbar-right{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
    .badge{
      font-size:11.5px;color:var(--text-dim);
      background:var(--surface);
      border:1px solid var(--border);
      padding:8px 13px;border-radius:99px;
      display:flex;align-items:center;gap:7px;
    }
    .badge b{color:var(--text);font-weight:600;}
    .quick-link-btn{
      height:38px;flex:0 0 auto;
      border-radius:10px;overflow:hidden;
      background:var(--surface);border:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:.15s ease;
      text-decoration:none;
    }
    .quick-link-btn:hover{border-color:var(--gold-dim);}
    .quick-link-btn img{height:100%;width:auto;display:block;object-fit:cover;}
    .btn-refresh{
      width:38px;height:38px;border-radius:10px;
      background:var(--surface);border:1px solid var(--border);
      color:var(--text-dim);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;transition:.15s ease;
    }
    .btn-refresh:hover{color:var(--gold);border-color:var(--gold-dim);}
    .btn-refresh.spinning svg{animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}

    /* ============== KPI CARDS ============== */
    .kpis{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
      margin-bottom:20px;
    }
    .kpi-card{
      background:var(--surface);
      border:1px solid var(--border-soft);
      border-radius:var(--radius);
      padding:18px 18px 16px;
      position:relative;
      overflow:hidden;
      cursor:pointer;
      transition:transform .22s var(--ease), border-color .22s var(--ease), background .22s var(--ease);
      opacity:0;
      animation:kpiIn .5s var(--ease) forwards;
    }
    .kpi-card:nth-child(1){animation-delay:.02s;}
    .kpi-card:nth-child(2){animation-delay:.08s;}
    .kpi-card:nth-child(3){animation-delay:.14s;}
    .kpi-card:nth-child(4){animation-delay:.2s;}
    @keyframes kpiIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
    .kpi-card::before{
      content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
      background:var(--accent,var(--gold));
      transition:width .22s var(--ease);
    }
    .kpi-card::after{
      content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;
      border-radius:50%;
      background:radial-gradient(circle, var(--accent,var(--gold)) 0%, transparent 70%);
      opacity:0;transition:opacity .25s var(--ease);
      pointer-events:none;
    }
    .kpi-card:hover{
      transform:translateY(-3px);
      border-color:color-mix(in srgb, var(--accent,var(--gold)) 45%, var(--border-soft));
      background:var(--surface-hover);
    }
    .kpi-card:hover::before{width:5px;}
    .kpi-card:hover::after{opacity:.07;}
    .kpi-card:active{transform:translateY(-1px);}
    .kpi-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;}
    .kpi-label{
      font-size:11px;letter-spacing:0.06em;color:var(--text-faint);
      margin-bottom:0;line-height:1.4;max-width:130px;
    }
    .kpi-icon{
      width:34px;height:34px;flex:0 0 34px;border-radius:10px;
      background:color-mix(in srgb, var(--accent,var(--gold)) 16%, transparent);
      display:flex;align-items:center;justify-content:center;
      color:var(--accent,var(--gold));
      transition:transform .25s var(--ease);
    }
    .kpi-card:hover .kpi-icon{transform:scale(1.08) rotate(-4deg);}
    .kpi-icon svg{width:17px;height:17px;}
    .kpi-value{
      font-family:'JetBrains Mono',monospace;
      font-size:27px;font-weight:600;color:var(--text);
      display:flex;align-items:baseline;gap:6px;
      position:relative;
    }
    .kpi-value small{font-size:13px;color:var(--text-faint);font-weight:500;}
    .kpi-sub{font-size:12px;color:var(--text-dim);margin-top:7px;position:relative;}
    .kpi-arrow{
      position:absolute;right:2px;bottom:2px;
      color:var(--text-faint);opacity:0;
      transform:translateX(-4px);
      transition:opacity .2s var(--ease), transform .2s var(--ease);
    }
    .kpi-card:hover .kpi-arrow{opacity:1;transform:translateX(0);color:var(--accent,var(--gold));}

    /* ============== CARD / SECTIONS ============== */
    .card{
      background:var(--surface);
      border:1px solid var(--border-soft);
      border-radius:var(--radius);
      padding:20px 22px 22px;
    }
    .card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
    .card-title{font-family:'Fraunces',serif;font-size:16px;font-weight:500;color:var(--text);}
    .card-title-sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

    .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
    .chart-wrap{position:relative;height:210px;display:flex;align-items:center;justify-content:center;}
    .legend-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:9px;}
    .legend-item{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;}
    .legend-left{display:flex;align-items:center;gap:8px;color:var(--text-dim);}
    .legend-dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;}
    .legend-val{font-family:'JetBrains Mono',monospace;color:var(--text);font-weight:500;}

    /* ---- Dona SVG (nativa, sin librerías externas) ---- */
    .donut-svg{width:190px;height:190px;}
    .donut-svg circle{transition:stroke-dasharray .7s ease;}
    .donut-center-val{font-family:'JetBrains Mono',monospace;font-weight:700;}
    .donut-center-label{font-family:'Inter',sans-serif;letter-spacing:.08em;}

    /* ---- Gráfico de barras (100% CSS) ---- */
    .bars-chart{display:flex;align-items:flex-end;justify-content:space-around;height:100%;width:100%;padding:0 6px;gap:10px;}
    .bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;flex:1;min-width:0;}
    .bar-value{
      font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;
      color:var(--text);margin-bottom:8px;
    }
    .bar-track{
      width:100%;max-width:44px;height:130px;
      background:var(--surface-2);border-radius:8px;
      display:flex;align-items:flex-end;overflow:hidden;
    }
    .bar-fill{width:100%;border-radius:8px 8px 0 0;transition:height .7s cubic-bezier(.2,.8,.2,1);min-height:3px;}
    .bar-label{
      font-size:10.5px;color:var(--text-faint);text-align:center;
      margin-top:9px;letter-spacing:.02em;line-height:1.3;
    }

    .finance-row{margin-bottom:14px;}
    .finance-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
    .finance-item{padding:4px 0;}
    .finance-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
    .finance-value{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:600;}
    .finance-bar-track{height:6px;border-radius:4px;background:var(--surface-2);margin-top:10px;overflow:hidden;}
    .finance-bar-fill{height:100%;border-radius:4px;}

    /* ============== DEBTORS TABLE ============== */
    .tabs{display:flex;gap:6px;flex-wrap:wrap;}
    .tab-btn{
      background:var(--surface-2);
      border:1px solid var(--border);
      color:var(--text-dim);
      font-size:12.5px;font-weight:500;
      padding:8px 13px;border-radius:99px;
      cursor:pointer;transition:.15s ease;
      display:flex;align-items:center;gap:7px;
    }
    .tab-btn:hover{color:var(--text);}
    .tab-btn.active{background:var(--gold-soft);border-color:rgba(201,161,92,0.4);color:var(--gold);}
    .tab-count{
      background:rgba(255,255,255,0.06);
      border-radius:99px;padding:1px 7px;font-size:11px;
      font-family:'JetBrains Mono',monospace;
    }
    .tab-btn.active .tab-count{background:rgba(201,161,92,0.22);}

    .table-wrap{margin-top:16px;max-height:360px;overflow-y:auto;border:1px solid var(--border-soft);border-radius:var(--radius-sm);}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    thead th{
      position:sticky;top:0;
      background:var(--surface-2);
      text-align:left;
      font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
      color:var(--text-faint);
      padding:10px 16px;
      border-bottom:1px solid var(--border);
      z-index:1;
    }
    thead th.num{text-align:right;}
    tbody td{padding:10px 16px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);}
    tbody tr:last-child td{border-bottom:none;}
    tbody tr:hover td{background:rgba(255,255,255,0.015);}
    td.casa{color:var(--text);font-weight:500;}
    td.saldo{
      font-family:'JetBrains Mono',monospace;
      text-align:right;color:var(--text);
    }
    .empty-table{padding:34px 16px;text-align:center;color:var(--text-faint);font-size:13px;}

    /* ============== INTERACTIVIDAD: gráficos ============== */
    .charts-row .card{transition:border-color .2s var(--ease);}
    .chart-tooltip{
      position:absolute;pointer-events:none;
      background:var(--bg-elevated);border:1px solid var(--border);
      border-radius:9px;padding:7px 11px;font-size:12px;color:var(--text);
      box-shadow:var(--shadow);white-space:nowrap;
      opacity:0;transform:translate(-50%,-8px);transition:opacity .15s var(--ease), transform .15s var(--ease);
      z-index:5;left:50%;top:0;
    }
    .chart-tooltip.show{opacity:1;transform:translate(-50%,-14px);}
    .chart-tooltip b{color:var(--gold-light);}

    .donut-svg circle.seg{cursor:pointer;transition:stroke-dasharray .7s ease, opacity .2s var(--ease), stroke-width .2s var(--ease);}
    .donut-svg.has-active circle.seg{opacity:.28;}
    .donut-svg.has-active circle.seg.active{opacity:1;stroke-width:27;}
    .donut-svg circle.seg:hover{opacity:1;}

    .legend-item{cursor:pointer;border-radius:7px;padding:6px 7px;margin:0 -7px;transition:background .15s var(--ease), opacity .15s var(--ease);}
    .legend-item:hover{background:var(--surface-hover);}
    .legend-list.has-active .legend-item{opacity:.45;}
    .legend-list.has-active .legend-item.active{opacity:1;background:var(--surface-hover);}
    .legend-item.active .legend-left{color:var(--text);font-weight:500;}

    .bar-col{cursor:pointer;}
    .bar-track{transition:box-shadow .2s var(--ease);}
    .bar-col:hover .bar-track{box-shadow:0 0 0 1px var(--border);}
    .bar-col:hover .bar-value{color:var(--gold-light);}

    /* ============== INTERACTIVIDAD: tabla de deudores ============== */
    .debtors-toolbar{display:flex;align-items:center;gap:10px;margin:14px 0 2px;flex-wrap:wrap;}
    .debtor-search{
      flex:1;min-width:180px;display:flex;align-items:center;gap:8px;
      background:var(--surface-2);border:1px solid var(--border);border-radius:99px;
      padding:8px 14px;transition:border-color .18s var(--ease);
    }
    .debtor-search:focus-within{border-color:var(--gold-dim);}
    .debtor-search svg{flex:0 0 auto;color:var(--text-faint);}
    .debtor-search input{
      flex:1;background:none;border:none;outline:none;color:var(--text);
      font-size:13px;font-family:'Inter',sans-serif;
    }
    .debtor-search input::placeholder{color:var(--text-faint);}
    .debtor-count{font-size:11.5px;color:var(--text-faint);white-space:nowrap;}

    th.sortable{cursor:pointer;user-select:none;}
    th.sortable:hover{color:var(--text-dim);}
    .sort-icon{display:inline-block;margin-left:4px;opacity:.5;transition:transform .18s var(--ease),opacity .18s var(--ease);}
    th.sortable.sort-desc .sort-icon{transform:rotate(180deg);opacity:1;}
    th.sortable.sort-asc .sort-icon{opacity:1;}

    tbody tr{position:relative;transition:background .15s var(--ease);}
    tbody tr:hover{background:var(--surface-hover);}
    tbody tr:hover td{background:none;}
    .saldo-bar{
      position:absolute;left:0;bottom:0;height:2px;
      background:linear-gradient(90deg, var(--amber), var(--red));
      transition:width .5s var(--ease);
    }
    mark{background:var(--gold-soft);color:var(--gold-light);border-radius:3px;padding:0 1px;}

    /* ============== INSIGHTS: medidor de salud + ranking ============== */
    .insights-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
    .gauge-wrap{position:relative;height:160px;display:flex;align-items:center;justify-content:center;}
    .gauge-svg{width:220px;height:150px;overflow:visible;}
    .gauge-needle{transform-origin:100px 100px;transition:transform 1s cubic-bezier(.22,.9,.2,1);}
    .gauge-center{position:absolute;bottom:6px;left:0;right:0;text-align:center;}
    .gauge-value{font-family:'JetBrains Mono',monospace;font-size:24px;font-weight:700;color:var(--text);}
    .gauge-status{font-size:11px;letter-spacing:.06em;margin-top:2px;}
    .gauge-legend{display:flex;justify-content:center;gap:16px;margin-top:6px;font-size:11px;color:var(--text-faint);}
    .gauge-legend span{display:flex;align-items:center;gap:5px;}
    .gauge-legend i{width:7px;height:7px;border-radius:50%;display:inline-block;}

    .ranking-list{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;}
    .ranking-item{
      display:flex;align-items:center;gap:12px;cursor:pointer;
      padding:6px 8px;margin:0 -8px;border-radius:9px;
      transition:background .15s var(--ease);
    }
    .ranking-item:hover{background:var(--surface-hover);}
    .ranking-item:hover .ranking-casa{color:var(--gold-light);}
    .rank-num{
      width:24px;height:24px;flex:0 0 24px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;
      background:var(--violet-soft);color:var(--violet-light);
    }
    .ranking-item:nth-child(1) .rank-num{background:var(--gold-soft);color:var(--gold-light);}
    .ranking-body{flex:1;min-width:0;}
    .ranking-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;margin-bottom:5px;}
    .ranking-casa{color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s var(--ease);}
    .ranking-saldo{font-family:'JetBrains Mono',monospace;color:var(--text-dim);flex:0 0 auto;}
    .ranking-track{height:5px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
    .ranking-fill{height:100%;border-radius:4px;width:0;transition:width .8s var(--ease);background:linear-gradient(90deg,var(--violet),var(--gold));}


    /* ============== FOCO POR TECLADO ============== */
    .kpi-card:focus-visible,
    .tab-btn:focus-visible,
    .btn-refresh:focus-visible,
    .quick-link-btn:focus-visible,
    th.sortable:focus-visible,
    .legend-item:focus-visible{
      outline:2px solid var(--gold-dim);outline-offset:2px;
    }
    .debtor-search input:focus{outline:none;}



    /* ============== STATES ============== */
    .loading-screen{
      position:fixed;inset:0;background:var(--bg);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
      z-index:50;
    }
    .loading-screen.hidden{display:none;}
    .spinner-ring{
      width:44px;height:44px;border-radius:50%;
      border:2.5px solid var(--border);
      border-top-color:var(--gold);
      animation:spin 0.8s linear infinite;
    }
    .loading-text{font-size:12.5px;color:var(--text-faint);letter-spacing:.06em;text-transform:uppercase;}

    .block-screen{
      min-height:100vh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:40px 24px;
    }
    .block-logo-glow{
      position:relative;
      display:flex;align-items:center;justify-content:center;
      margin-bottom:26px;
    }
    .block-logo-glow::before{
      content:'';
      position:absolute;
      width:190px;height:190px;
      border-radius:50%;
      background:radial-gradient(circle, var(--glow-color) 0%, transparent 68%);
      filter:blur(6px);
      opacity:0.5;
      z-index:0;
    }
    .block-logo{
      width:104px;height:104px;
      display:flex;align-items:center;justify-content:center;
      overflow:hidden;
      position:relative;
      z-index:1;
    }
    .block-logo img{width:100%;height:100%;object-fit:contain;}
    .block-logo svg{width:52px;height:52px;}
    .block-icon{
      width:74px;height:74px;border-radius:50%;
      border:1px solid;
      display:flex;align-items:center;justify-content:center;
      margin-bottom:22px;
    }
    .block-icon svg{width:32px;height:32px;}
    .block-title{
      font-family:'Fraunces',serif;font-weight:500;font-size:24px;
      color:var(--text);margin:0 0 10px;
    }
    .block-msg{font-size:14px;color:var(--text-dim);max-width:420px;margin:0;line-height:1.7;}

    .empty-state{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:70px 20px;color:var(--text-dim);
    }
    .empty-state svg{width:46px;height:46px;color:var(--text-faint);margin-bottom:14px;}
    .empty-state h3{font-family:'Fraunces',serif;font-weight:500;font-size:18px;color:var(--text);margin:0 0 8px;}
    .empty-state p{font-size:13px;color:var(--text-faint);max-width:360px;margin:0;line-height:1.6;}

    .toast{
      position:fixed;bottom:22px;right:22px;
      background:var(--surface-2);border:1px solid var(--red);
      color:var(--text);padding:13px 18px;border-radius:var(--radius-sm);
      font-size:13px;box-shadow:var(--shadow);z-index:60;
      max-width:340px;
    }

    .fade-in{animation:fadeIn .35s ease both;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

    @media (max-width:980px){
      .main{padding:20px;}
      .kpis{grid-template-columns:repeat(2,1fr);}
      .charts-row{grid-template-columns:1fr;}
      .insights-row{grid-template-columns:1fr;}
      .finance-grid{grid-template-columns:1fr;gap:14px;}
    }
    @media (max-width:680px){
      .topnav{padding:12px 16px;gap:14px;}
      .brand-text{display:none;}
      .brand{padding-right:14px;}
      .topnav-footer{display:none;}
      .kpis{grid-template-columns:1fr 1fr;}
    }
  </style>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">
    <div class="spinner-ring"></div>
    <div class="loading-text">Cargando dashboard…</div>
  </div>

  <div class="app" id="app" style="display:none;">
    <!-- ============== TOPNAV ============== -->
    <header class="topnav">
      <div class="brand">
        <div class="brand-emblem" id="empresaLogoWrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="#C9A15C" stroke-width="1.6"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-7h6v7"/><path d="M4 21h16"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-title">Administración de Condominios</div>
          <div class="brand-sub">Panel de gestión</div>
        </div>
      </div>
      <div class="nav-group">
        <span class="nav-label">Condominios</span>
        <ul class="nav-list" id="navList"></ul>
      </div>
      <div class="topnav-footer">
        <span id="footerClock">—</span>
        <span id="footerCount">0 condominios</span>
      </div>
    </header>

    <!-- ============== MAIN ============== -->
    <main class="main" id="mainContent">
      <!-- filled dynamically -->
    </main>
  </div>

<script>
/* ==========================================================================
 *  ESTADO GLOBAL
 * ======================================================================== */
const EMPRESA_FALLBACK = {
  nombre: 'Sistema de Administración de Condominios',
  logo: 'https://www.appsheet.com:443/fsimage.png?appid=a1e80fbe-c271-4911-826d-05b21b90e880&datasource=google&filename=DocId%3D1qEe645o4akG7FD-H90Z8xT479Lz65SdH&signature=e17b9a139af8848ef35f37882d40f1a8a098f22c5627d8879a8c1dd967590f2f&tableprovider=google&userid=5890721'
};

/* ==========================================================================
 *  CONEXIÓN CON EL BACKEND (Google Apps Script Web App)
 *  Este HTML ya no depende de ejecutarse dentro de Apps Script: se conecta
 *  por fetch() a la URL del Web App publicado desde CODIGO_DASH.gs.
 *
 *  ⚠️ IMPORTANTE: reemplaza el valor de abajo por la URL de tu propia
 *  implementación (Implementar → Nueva implementación → Aplicación web →
 *  Ejecutar como: Yo → Acceso: Cualquier usuario). Termina en "/exec".
 * ======================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxHyohV7Vs6XZjBvj5jsCGB9fCF1ic6TzfnPfshFIeLRxbUL4FtC9EPsJrqeAe_h-0c6A/exec';

/**
 * Llama a una acción del backend (Apps Script) vía GET y devuelve los datos.
 * Lanza un Error si la respuesta indica fallo, para reutilizar los mismos
 * manejadores onError() que antes usaba google.script.run.
 */
async function callApi(action, params){
  const url = new URL(API_URL);
  url.searchParams.set('action', action);
  Object.keys(params || {}).forEach(k => url.searchParams.set(k, params[k]));

  const res = await fetch(url.toString());
  if (!res.ok) throw new Error('Error de red (' + res.status + ') al llamar "' + action + '".');

  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Error desconocido en "' + action + '".');
  return json.data;
}

// Botón de acceso rápido junto al balance del mes (redirige a otra Apps Script Web App)
// Imagen del botón de acceso rápido (igual para todos); el destino (URL) ahora
// viene por condominio desde el Sheet (campo enlace). Este es solo el respaldo
// por si el backend no envía nada.
const CONSULTA_ZONAS_IMG = 'https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEj-BA9r5CNVq44WXMp3LI0WSdNTMUkjXvj6wYobF-EsWzUU-3MRLa-2N17CXr9dNSM0iu8nZS8zSRX_j6ApDS4BU3zqsY7qSPPHZelandN7X1rWldNM0POrAuqRWu8jWTGoFZ442B7S5MKynGgBZb08jC8x-mm33NVTTLY_1dD-bSPwABriZR1UoQyC300/w200-h151/CONSULTA.png';
const CONSULTA_ZONAS_URL_RESPALDO = 'https://script.google.com/macros/s/AKfycbwDmnwxiRL0ojdUGjb3bm73Ys_3-oQKLA3eAP2WrtEO6RRnNCVki1mv5S39tSFLZiz2/exec';

const state = {
  condominios: [],
  activo: null,
  datos: null,
  tabActiva: 'unRecibo',
  donutActiveIdx: null,
  debtorSearch: '',
  debtorSortDir: null // null | 'asc' | 'desc'
};

const TAB_DEFS = [
  { key: 'unRecibo', label: '1 recibo' },
  { key: 'dosRecibos', label: '2 recibos' },
  { key: 'tresRecibos', label: '3 recibos' },
  { key: 'masDe4', label: '4+ recibos' }
];

/* ==========================================================================
 *  UTILIDADES
 * ======================================================================== */
function formatMoney(n){
  const v = Number(n) || 0;
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function colorEstado(estatus){
  const t = String(estatus).toUpperCase();
  if (t.indexOf('AL DIA') !== -1 || t.indexOf('AL DÍA') !== -1) return getCss('--teal');
  if (t.indexOf('COBRANZA') !== -1) return getCss('--red');
  if (t.indexOf('DEUDA') !== -1) return getCss('--amber');
  return getCss('--gold');
}
function getCss(varName){
  return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast fade-in';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}
function updateClock(){
  const el = document.getElementById('footerClock');
  if (!el) return;
  const now = new Date();
  el.textContent = now.toLocaleDateString('es-PE', { day:'2-digit', month:'short' }) + ' · ' +
    now.toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit' });
}

/* ==========================================================================
 *  INICIALIZACIÓN
 * ======================================================================== */
document.addEventListener('DOMContentLoaded', init);

function init(){
  const emp = EMPRESA_FALLBACK;
  document.getElementById('empresaLogoWrap').innerHTML =
    '<img src="' + emp.logo + '" onerror="this.parentElement.innerHTML=\'' +
    '<svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;%23C9A15C&quot; stroke-width=&quot;1.6&quot;><path d=&quot;M4 21V8l8-5 8 5v13&quot;/><path d=&quot;M9 21v-7h6v7&quot;/><path d=&quot;M4 21h16&quot;/></svg>\'">';

  updateClock();
  setInterval(updateClock, 30000);

  callApi('getEstadoApp')
    .then(onEstadoApp)
    .catch(() => {
      // Si falla la verificación de estado, no bloqueamos el sistema: seguimos con normalidad.
      callApi('getListaCondominios').then(onCondominios).catch(onError);
    });
}

function onEstadoApp(info){
  const estado = info && info.estado ? info.estado : 'ACTIVO';

  if (estado === 'CERRADO' || estado === 'MANTENIMIENTO'){
    document.getElementById('loadingScreen').classList.add('hidden');
    renderBlockScreen(estado, (info && info.mensaje) || '');
    return;
  }

  callApi('getListaCondominios').then(onCondominios).catch(onError);
}

function renderBlockScreen(estado, mensaje){
  const esCerrado = estado === 'CERRADO';
  const color = esCerrado ? 'var(--red)' : 'var(--amber)';
  const titulo = esCerrado ? 'Sistema cerrado temporalmente' : 'En mantenimiento';
  const defaultMsg = esCerrado
    ? 'El acceso al dashboard está deshabilitado por el momento. Vuelve a intentarlo más tarde.'
    : 'Estamos realizando mejoras en el sistema. El dashboard volverá a estar disponible en breve.';
  const icono = esCerrado
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.6"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="1.6"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6V21h3.3l6-6a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2z"/></svg>';

  document.body.innerHTML =
    '<div class="block-screen fade-in">' +
      '<div class="block-logo-glow" style="--glow-color:' + color + '">' +
        '<div class="block-logo" id="blockLogoWrap">' +
          '<img src="' + EMPRESA_FALLBACK.logo + '" alt="Logo" onerror="this.parentElement.innerHTML=blockLogoFallback();">' +
        '</div>' +
      '</div>' +
      '<div class="block-icon" style="border-color:' + color + '33;background:' + color + '1a;">' + icono + '</div>' +
      '<h1 class="block-title">' + titulo + '</h1>' +
      '<p class="block-msg">' + esc(mensaje || defaultMsg) + '</p>' +
    '</div>';
}

function blockLogoFallback(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#C9A15C" stroke-width="1.6"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-7h6v7"/><path d="M4 21h16"/></svg>';
}

function onCondominios(lista){
  state.condominios = lista || [];
  document.getElementById('footerCount').textContent =
    state.condominios.length + (state.condominios.length === 1 ? ' condominio' : ' condominios');

  renderNav();

  if (state.condominios.length === 0){
    revealApp();
    renderEmptyState();
    return;
  }
  cargarCondominio(state.condominios[0]);
}

function onError(err){
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
  showToast('Error: ' + (err && err.message ? err.message : err));
}

function revealApp(){
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('app').style.display = 'flex';
}

/* ==========================================================================
 *  NAVEGACIÓN LATERAL
 * ======================================================================== */
function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = state.condominios.map(nombre => (
    '<li class="nav-item' + (nombre === state.activo ? ' active' : '') + '" data-nombre="' + esc(nombre) + '">' +
      '<span class="nav-dot"></span>' +
      '<span class="nav-item-name">' + esc(nombre) + '</span>' +
    '</li>'
  )).join('');

  nav.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => cargarCondominio(el.getAttribute('data-nombre')));
  });
}

function cargarCondominio(nombre){
  const esCondominioDistinto = state.activo !== nombre;
  state.activo = nombre;
  state.tabActiva = 'unRecibo';
  if (esCondominioDistinto){
    state.debtorSearch = '';
    state.debtorSortDir = null;
  }
  renderNav();

  const spinBtn = document.getElementById('btnRefresh');
  if (spinBtn) spinBtn.classList.add('spinning');

  callApi('getDatosCondominio', { nombre: nombre })
    .then(datos => {
      state.datos = datos;
      revealApp();
      renderMain();
    })
    .catch(err => {
      revealApp();
      onError(err);
    });
}

/* ==========================================================================
 *  RENDER PRINCIPAL
 * ======================================================================== */
function renderEmptyState(){
  document.getElementById('mainContent').innerHTML =
    '<div class="empty-state">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-7h6v7"/><path d="M4 21h16"/></svg>' +
      '<h3>Aún no hay condominios registrados</h3>' +
      '<p>Abre el Google Sheet y usa el menú <b>⚙️ Dashboard Condominios → Inicializar sistema</b> para crear tu primer condominio. Cada hoja nueva con el mismo formato aparecerá aquí automáticamente.</p>' +
    '</div>';
}

function renderMain(){
  const d = state.datos;
  if (!d) return;

  const main = document.getElementById('mainContent');
  const debtorsHtml = d.mostrarDeudores !== false ? buildDebtorsCard(d) : '';
  main.innerHTML = buildTopbar(d) + buildKpis(d) + buildChartsRow() + buildFinanceRow(d) + buildInsightsRow(d) + debtorsHtml;

  // Cada sección corre en su propio try/catch: si una falla, las demás igual se muestran.
  try { document.getElementById('btnRefresh').addEventListener('click', () => cargarCondominio(state.activo)); }
  catch (e) { console.error('refresh btn', e); }

  try { wireKpiActions(d); } catch (e) { console.error('kpis', e); }
  try { wireLogo(d); } catch (e) { console.error('logo', e); }
  try { renderDonut(d); } catch (e) { console.error('donut', e); showChartError('donutWrap'); }
  try { renderBars(d); } catch (e) { console.error('bars', e); showChartError('barsWrap'); }
  try { renderGauge(d); } catch (e) { console.error('gauge', e); showChartError('gaugeWrap'); }
  if (d.mostrarDeudores !== false) {
    try { renderRanking(d); } catch (e) { console.error('ranking', e); showChartError('rankingWrap'); }
    try { renderTabs(d); } catch (e) { console.error('tabs', e); }
    try { renderTable(d); } catch (e) { console.error('table', e); }
  }
}

function showChartError(elId){
  const el = document.getElementById(elId);
  if (el) el.innerHTML = '<div class="empty-table">No se pudo mostrar el gráfico.</div>';
}

function wireLogo(d){
  const wrap = document.getElementById('condoLogoWrap');
  if (!wrap) return;
  if (d.logo){
    wrap.innerHTML = '<img src="' + esc(d.logo) + '" onerror="this.parentElement.innerHTML=defaultCondoIcon();">';
  } else {
    wrap.innerHTML = defaultCondoIcon();
  }
}
function defaultCondoIcon(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="#C9A15C" stroke-width="1.6"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/><path d="M9 12h.01M15 12h.01M9 9h.01M15 9h.01"/></svg>';
}

/* ---------- Topbar ---------- */
function buildTopbar(d){
  return (
    '<div class="topbar fade-in">' +
      '<div class="topbar-left">' +
        '<div class="condo-logo" id="condoLogoWrap"></div>' +
        '<div class="condo-title-wrap">' +
          '<div class="eyebrow">Vista del condominio</div>' +
          '<div class="condo-title">' + esc(d.nombre) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="topbar-right">' +
        '<div class="badge">Balance del mes <b style="color:' + (d.balance >= 0 ? 'var(--teal)' : 'var(--red)') + '">' + formatMoney(d.balance) + '</b></div>' +
        '<a class="quick-link-btn" href="' + esc(d.enlace || CONSULTA_ZONAS_URL_RESPALDO) + '" target="_blank" rel="noopener" title="Consulta de zonas">' +
          '<img src="' + CONSULTA_ZONAS_IMG + '" alt="Consulta de zonas">' +
        '</a>' +
        '<button class="btn-refresh" id="btnRefresh" title="Actualizar">' +
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>' +
        '</button>' +
      '</div>' +
    '</div>'
  );
}

/* ---------- KPIs ---------- */
const KPI_ICONS = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>',
  scale: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="m7 8-4 8a4.5 4.5 0 0 0 8 0Z"/><path d="m17 8 4 8a4.5 4.5 0 0 1-8 0Z"/><path d="M7 8h10"/><circle cx="12" cy="5" r="2"/></svg>',
  coins: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="9" cy="6" rx="6" ry="3"/><path d="M3 6v5c0 1.66 2.69 3 6 3s6-1.34 6-3V6"/><path d="M3 11v5c0 1.66 2.69 3 6 3s6-1.34 6-3v-5"/><path d="M15 9.4c3.4.3 6 1.6 6 3.1 0 1.66-2.69 3-6 3s-6-1.34-6-3"/></svg>'
};

function buildKpis(d){
  const alDia = d.estados.find(e => /AL DIA|AL DÍA/i.test(e.estatus));
  const conDeuda = d.estados.find(e => /DEUDA/i.test(e.estatus) && !/COBRANZA/i.test(e.estatus));
  const cobranza = d.estados.find(e => /COBRANZA/i.test(e.estatus));
  const idxAlDia = d.estados.indexOf(alDia);
  const idxConDeuda = d.estados.indexOf(conDeuda);
  const idxCobranza = d.estados.indexOf(cobranza);

  const totalCasasDeuda = d.deudoresRecibo.unRecibo + d.deudoresRecibo.dosRecibos + d.deudoresRecibo.tresRecibos + d.deudoresRecibo.masDe4;

  const cards = [
    {
      label: 'Casas al día', accent: 'var(--teal)', icon: 'check',
      raw: alDia ? alDia.porcentaje : 0, kind: 'pct',
      sub: alDia ? esc(alDia.estatus) : '—',
      action: idxAlDia >= 0 ? 'donut:' + idxAlDia : null, actionLabel: 'Ver en el gráfico'
    },
    {
      label: 'Casas con deuda', accent: 'var(--amber)', icon: 'alert',
      raw: conDeuda ? conDeuda.porcentaje : 0, kind: 'pct',
      sub: totalCasasDeuda + ' casas con saldo pendiente',
      action: idxConDeuda >= 0 ? 'donut:' + idxConDeuda : null, actionLabel: 'Ver en el gráfico'
    },
    {
      label: 'Cobranza externa', accent: 'var(--red)', icon: 'scale',
      raw: cobranza ? cobranza.porcentaje : 0, kind: 'pct',
      sub: cobranza ? esc(cobranza.estatus) : '—',
      action: idxCobranza >= 0 ? 'donut:' + idxCobranza : null, actionLabel: 'Ver en el gráfico'
    },
    {
      label: 'Deuda total acumulada', accent: 'var(--gold)', icon: 'coins',
      raw: d.totalMontoDeuda, kind: 'money',
      sub: 'Suma de saldos pendientes',
      action: d.mostrarDeudores !== false ? 'table' : null, actionLabel: 'Ver detalle'
    }
  ];

  return '<div class="kpis">' + cards.map((c, i) =>
    '<div class="kpi-card" style="--accent:' + c.accent + '"' +
      (c.action ? ' data-action="' + c.action + '"' : '') +
      ' tabindex="0" role="button" aria-label="' + c.label + '">' +
      '<div class="kpi-top">' +
        '<div class="kpi-label">' + c.label + '</div>' +
        '<div class="kpi-icon">' + KPI_ICONS[c.icon] + '</div>' +
      '</div>' +
      '<div class="kpi-value" data-kind="' + c.kind + '" data-raw="' + c.raw + '">' +
        (c.kind === 'pct' ? '0%' : '$0.00') +
      '</div>' +
      '<div class="kpi-sub">' + c.sub +
        (c.action ? '<span class="kpi-arrow">' + c.actionLabel + ' →</span>' : '') +
      '</div>' +
    '</div>'
  ).join('') + '</div>';
}

/** Anima un valor numérico de 0 al valor final dentro del nodo dado. */
function animateKpiValue(el){
  const kind = el.getAttribute('data-kind');
  const end = Number(el.getAttribute('data-raw')) || 0;
  const t0 = performance.now();
  const dur = 700;
  function tick(now){
    const p = Math.min((now - t0) / dur, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    const val = end * eased;
    el.textContent = kind === 'pct' ? Math.round(val) + '%' : formatMoney(val);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function wireKpiActions(d){
  document.querySelectorAll('.kpi-card').forEach(card => {
    card.querySelectorAll('.kpi-value').forEach(animateKpiValue);
    const action = card.getAttribute('data-action');
    if (!action) return;
    const trigger = () => {
      if (action.indexOf('donut:') === 0){
        const idx = Number(action.split(':')[1]);
        const target = document.getElementById('cardEstado');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => setDonutHighlight(idx), 250);
      } else if (action === 'table'){
        const target = document.getElementById('debtorsCard');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };
    card.addEventListener('click', trigger);
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); trigger(); } });
  });
}

/** Gráfico de dona dibujado en SVG puro (stroke-dasharray por segmento), con hover y resaltado. */
function renderDonut(d){
  const wrap = document.getElementById('donutWrap');
  const legend = document.getElementById('legendEstado');
  const estados = (d.estados || []).filter(e => e.porcentaje > 0);
  state.donutActiveIdx = null;

  if (estados.length === 0){
    wrap.innerHTML = '<div class="empty-table">Sin datos de estado registrados.</div>';
    legend.innerHTML = '';
    return;
  }

  const total = estados.reduce((a, e) => a + e.porcentaje, 0) || 100;
  const r = 78, cx = 100, cy = 100, sw = 24;
  const circunferencia = 2 * Math.PI * r;
  const trackColor = getCss('--surface-2');
  const textColor = getCss('--text');
  const faintColor = getCss('--text-faint');

  let acumulado = 0;
  const colors = [];
  const circles = estados.map((e, i) => {
    const color = colorEstado(e.estatus);
    colors.push(color);
    const frac = e.porcentaje / total;
    const largo = frac * circunferencia;
    const gap = Math.max(circunferencia - largo, 0);
    const dashoffset = -acumulado;
    acumulado += largo;
    return '<circle class="seg" data-idx="' + i + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + color +
      '" stroke-width="' + sw + '" stroke-dasharray="' + largo + ' ' + gap +
      '" stroke-dashoffset="' + dashoffset + '"/>';
  }).join('');

  const principal = estados.find(e => /AL DIA|AL DÍA/i.test(e.estatus)) || estados[0];

  wrap.innerHTML =
    '<svg class="donut-svg" id="donutSvg" viewBox="0 0 200 200">' +
      '<g transform="rotate(-90 100 100)">' +
        '<circle cx="100" cy="100" r="' + r + '" fill="none" stroke="' + trackColor + '" stroke-width="' + sw + '"/>' +
        circles +
      '</g>' +
      '<text x="100" y="96" text-anchor="middle" class="donut-center-val" id="donutCenterVal" font-size="30" fill="' + textColor + '">' + Math.round(principal.porcentaje) + '%</text>' +
      '<text x="100" y="118" text-anchor="middle" class="donut-center-label" id="donutCenterLabel" font-size="10.5" fill="' + faintColor + '" letter-spacing="1.2">' + esc(principal.estatus).toUpperCase() + '</text>' +
    '</svg>' +
    '<div class="chart-tooltip" id="donutTip"></div>';

  legend.innerHTML = estados.map((e, i) =>
    '<li class="legend-item" data-idx="' + i + '" tabindex="0" role="button">' +
      '<span class="legend-left"><span class="legend-dot" style="background:' + colors[i] + '"></span>' + esc(e.estatus) + '</span>' +
      '<span class="legend-val">' + e.porcentaje + '%</span>' +
    '</li>'
  ).join('');

  // Guarda los datos para reutilizarlos en hover / clic / centro de la dona.
  wrap._estados = estados;
  wrap._principal = principal;

  const tip = document.getElementById('donutTip');
  const svg = document.getElementById('donutSvg');

  function showTip(idx, evt){
    const e = estados[idx];
    tip.innerHTML = '<b>' + esc(e.estatus) + '</b> · ' + e.porcentaje + '%';
    tip.classList.add('show');
    const rect = wrap.getBoundingClientRect();
    const x = evt.clientX - rect.left;
    const y = evt.clientY - rect.top;
    tip.style.left = x + 'px';
    tip.style.top = Math.max(y - 40, 0) + 'px';
  }
  function hideTip(){ tip.classList.remove('show'); }

  svg.querySelectorAll('circle.seg').forEach(c => {
    const idx = Number(c.getAttribute('data-idx'));
    c.addEventListener('mousemove', evt => showTip(idx, evt));
    c.addEventListener('mouseleave', hideTip);
    c.addEventListener('click', () => setDonutHighlight(idx));
  });
  legend.querySelectorAll('.legend-item').forEach(li => {
    const idx = Number(li.getAttribute('data-idx'));
    li.addEventListener('mouseenter', () => setDonutHover(idx, true));
    li.addEventListener('mouseleave', () => setDonutHover(idx, false));
    li.addEventListener('click', () => setDonutHighlight(idx));
    li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setDonutHighlight(idx); } });
  });
}

/** Resalta temporalmente un segmento al pasar el mouse por la leyenda (sin fijar selección). */
function setDonutHover(idx, on){
  if (state.donutActiveIdx !== null) return; // si ya hay uno fijado por clic, no interferir
  const svg = document.getElementById('donutSvg');
  const legend = document.getElementById('legendEstado');
  if (!svg || !legend) return;
  svg.classList.toggle('has-active', on);
  legend.classList.toggle('has-active', on);
  svg.querySelectorAll('circle.seg').forEach(c => c.classList.toggle('active', on && Number(c.getAttribute('data-idx')) === idx));
  legend.querySelectorAll('.legend-item').forEach(li => li.classList.toggle('active', on && Number(li.getAttribute('data-idx')) === idx));
}

/** Fija (o quita) el resaltado de un segmento al hacer clic; actualiza también el centro de la dona. */
function setDonutHighlight(idx){
  const svg = document.getElementById('donutSvg');
  const legend = document.getElementById('legendEstado');
  const wrap = document.getElementById('donutWrap');
  if (!svg || !legend || !wrap || !wrap._estados) return;

  const turnOff = state.donutActiveIdx === idx;
  state.donutActiveIdx = turnOff ? null : idx;

  const active = state.donutActiveIdx !== null;
  svg.classList.toggle('has-active', active);
  legend.classList.toggle('has-active', active);
  svg.querySelectorAll('circle.seg').forEach(c => c.classList.toggle('active', active && Number(c.getAttribute('data-idx')) === idx));
  legend.querySelectorAll('.legend-item').forEach(li => li.classList.toggle('active', active && Number(li.getAttribute('data-idx')) === idx));

  const centerVal = document.getElementById('donutCenterVal');
  const centerLabel = document.getElementById('donutCenterLabel');
  const shown = active ? wrap._estados[idx] : wrap._principal;
  if (centerVal && centerLabel && shown){
    centerVal.textContent = Math.round(shown.porcentaje) + '%';
    centerLabel.textContent = esc(shown.estatus).toUpperCase();
  }
}

/** Gráfico de barras dibujado en HTML/CSS puro (altura proporcional al valor máximo), con tooltip. */
function renderBars(d){
  const wrap = document.getElementById('barsWrap');
  const items = [
    { label: '1 recibo', val: d.deudoresRecibo.unRecibo, color: '#E7C989' },
    { label: '2 recibos', val: d.deudoresRecibo.dosRecibos, color: '#D9AF6C' },
    { label: '3 recibos', val: d.deudoresRecibo.tresRecibos, color: '#C9A15C' },
    { label: '4+ recibos', val: d.deudoresRecibo.masDe4, color: '#A9814A' }
  ];
  const max = Math.max(items.reduce((m, i) => Math.max(m, i.val), 0), 1);
  const totalCasas = items.reduce((a, i) => a + i.val, 0) || 1;

  wrap.innerHTML = '<div class="bars-chart">' + items.map((i, idx) =>
    '<div class="bar-col" data-idx="' + idx + '">' +
      '<div class="bar-value">' + i.val + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="height:0%;background:linear-gradient(180deg,' + i.color + ',color-mix(in srgb,' + i.color + ' 65%, black))" data-h="' + (i.val / max * 100) + '"></div></div>' +
      '<div class="bar-label">' + i.label + '</div>' +
    '</div>'
  ).join('') + '</div><div class="chart-tooltip" id="barsTip"></div>';

  // Anima el crecimiento de las barras en el siguiente frame.
  requestAnimationFrame(() => {
    wrap.querySelectorAll('.bar-fill').forEach(el => {
      el.style.height = el.getAttribute('data-h') + '%';
    });
  });

  const tip = document.getElementById('barsTip');
  wrap.querySelectorAll('.bar-col').forEach(col => {
    const idx = Number(col.getAttribute('data-idx'));
    const item = items[idx];
    const pct = Math.round(item.val / totalCasas * 100);
    col.addEventListener('mousemove', evt => {
      tip.innerHTML = '<b>' + item.val + ' casas</b> · ' + pct + '% del total con deuda';
      tip.classList.add('show');
      const rect = wrap.getBoundingClientRect();
      tip.style.left = (evt.clientX - rect.left) + 'px';
      tip.style.top = Math.max((evt.clientY - rect.top) - 44, 0) + 'px';
    });
    col.addEventListener('mouseleave', () => tip.classList.remove('show'));
  });
}

/** Combina las 4 listas de deudores en un solo arreglo, conservando de qué pestaña viene cada uno. */
function getAllDeudores(d){
  const out = [];
  TAB_DEFS.forEach(t => {
    (d.listas[t.key] || []).forEach(item => out.push({ casa: item.casa, saldo: item.saldo, tabKey: t.key }));
  });
  return out;
}

/** Medidor semicircular: egresos/ingresos, con zonas de color y aguja animada. */
function renderGauge(d){
  const wrap = document.getElementById('gaugeWrap');
  const ingresos = Number(d.ingresos) || 0;
  const egresos = Number(d.egresos) || 0;
  const ratioReal = ingresos > 0 ? (egresos / ingresos * 100) : (egresos > 0 ? 150 : 0);
  const ratio = Math.max(0, Math.min(ratioReal, 150)); // se limita visualmente a 150%

  let status, statusColor;
  if (ratioReal <= 70) { status = 'Saludable'; statusColor = 'var(--teal)'; }
  else if (ratioReal <= 95) { status = 'Atención'; statusColor = 'var(--amber)'; }
  else { status = 'Riesgo'; statusColor = 'var(--red)'; }

  const trackColor = getCss('--surface-2');
  const teal = getCss('--teal'), amber = getCss('--amber'), red = getCss('--red');
  // Fracciones de la semicircunferencia (pathLength normalizado a 100): 0-70% sano, 70-95% atención, 95-150% riesgo.
  const zTeal = 70/150*100, zAmber = 25/150*100, zRed = 55/150*100;
  const needleAngle = (ratio/150*180) - 90;

  wrap.innerHTML =
    '<svg class="gauge-svg" viewBox="0 0 200 115">' +
      '<path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="' + trackColor + '" stroke-width="16" pathLength="100"/>' +
      '<path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="' + teal + '" stroke-width="16" pathLength="100" stroke-dasharray="' + zTeal + ' 100" stroke-dashoffset="0"/>' +
      '<path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="' + amber + '" stroke-width="16" pathLength="100" stroke-dasharray="' + zAmber + ' 100" stroke-dashoffset="-' + zTeal + '"/>' +
      '<path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="' + red + '" stroke-width="16" pathLength="100" stroke-dasharray="' + zRed + ' 100" stroke-dashoffset="-' + (zTeal + zAmber) + '"/>' +
      '<g class="gauge-needle" style="transform:rotate(' + needleAngle + 'deg)">' +
        '<line x1="100" y1="100" x2="100" y2="32" stroke="' + getCss('--text') + '" stroke-width="2.5" stroke-linecap="round"/>' +
        '<circle cx="100" cy="100" r="6" fill="' + getCss('--text') + '"/>' +
      '</g>' +
    '</svg>' +
    '<div class="gauge-center">' +
      '<div class="gauge-value">' + Math.round(ratioReal) + '%</div>' +
      '<div class="gauge-status" style="color:' + statusColor + '">' + status + '</div>' +
    '</div>';

  // La aguja arranca en 0 y anima hacia su posición real.
  const needle = wrap.querySelector('.gauge-needle');
  needle.style.transform = 'rotate(-90deg)';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    needle.style.transform = 'rotate(' + needleAngle + 'deg)';
  }));
}

/** Ranking de las 5 casas con mayor saldo pendiente, cruzando las 4 listas de deudores. */
function renderRanking(d){
  const wrap = document.getElementById('rankingWrap');
  if (!wrap) return;
  const top = getAllDeudores(d).sort((a, b) => b.saldo - a.saldo).slice(0, 5);

  if (top.length === 0){
    wrap.innerHTML = '<div class="empty-table">No hay deudores registrados.</div>';
    return;
  }

  const max = Math.max(top[0].saldo, 1);
  wrap.innerHTML = top.map((item, i) =>
    '<li class="ranking-item" data-casa="' + esc(item.casa) + '" data-tab="' + item.tabKey + '" tabindex="0" role="button">' +
      '<div class="rank-num">' + (i + 1) + '</div>' +
      '<div class="ranking-body">' +
        '<div class="ranking-top"><span class="ranking-casa">' + esc(item.casa) + '</span><span class="ranking-saldo">' + formatMoney(item.saldo) + '</span></div>' +
        '<div class="ranking-track"><div class="ranking-fill" data-w="' + (item.saldo/max*100) + '"></div></div>' +
      '</div>' +
    '</li>'
  ).join('');

  requestAnimationFrame(() => {
    wrap.querySelectorAll('.ranking-fill').forEach(el => { el.style.width = el.getAttribute('data-w') + '%'; });
  });

  wrap.querySelectorAll('.ranking-item').forEach(li => {
    const go = () => {
      state.tabActiva = li.getAttribute('data-tab');
      state.debtorSearch = li.getAttribute('data-casa');
      renderTabs(d);
      renderTable(d);
      const target = document.getElementById('debtorsCard');
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    li.addEventListener('click', go);
    li.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); } });
  });
}

/* ---------- Debtors card ---------- */
function buildDebtorsCard(d){
  return (
    '<div class="card fade-in" id="debtorsCard" style="margin-top:14px;">' +
      '<div class="card-header">' +
        '<div><div class="card-title">Detalle de deudores</div><div class="card-title-sub">Casas con saldo pendiente, agrupadas por cantidad de recibos</div></div>' +
      '</div>' +
      '<div class="tabs" id="tabs"></div>' +
      '<div class="debtors-toolbar">' +
        '<label class="debtor-search">' +
          '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>' +
          '<input type="text" id="debtorSearchInput" placeholder="Buscar casa..." autocomplete="off">' +
        '</label>' +
        '<span class="debtor-count" id="debtorCount"></span>' +
      '</div>' +
      '<div class="table-wrap" id="tableWrap"></div>' +
    '</div>'
  );
}

function renderTabs(d){
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = TAB_DEFS.map(t =>
    '<button class="tab-btn' + (t.key === state.tabActiva ? ' active' : '') + '" data-key="' + t.key + '">' +
      t.label + ' <span class="tab-count">' + d.listas[t.key].length + '</span>' +
    '</button>'
  ).join('');
  tabs.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.getAttribute('data-key') === state.tabActiva) return;
      state.tabActiva = btn.getAttribute('data-key');
      renderTabs(d);
      renderTable(d);
    });
  });

  const search = document.getElementById('debtorSearchInput');
  if (search){
    search.value = state.debtorSearch;
    search.oninput = () => {
      state.debtorSearch = search.value;
      renderTable(d);
    };
  }
}

function renderTable(d){
  const wrap = document.getElementById('tableWrap');
  const countEl = document.getElementById('debtorCount');
  let lista = (d.listas[state.tabActiva] || []).slice();

  const q = (state.debtorSearch || '').trim().toLowerCase();
  if (q) lista = lista.filter(item => String(item.casa).toLowerCase().indexOf(q) !== -1);

  if (state.debtorSortDir){
    lista.sort((a, b) => state.debtorSortDir === 'asc' ? a.saldo - b.saldo : b.saldo - a.saldo);
  }

  if (countEl) countEl.textContent = lista.length + (lista.length === 1 ? ' casa' : ' casas');

  if (lista.length === 0){
    wrap.innerHTML = '<div class="empty-table">' +
      (q ? 'Ninguna casa coincide con "' + esc(state.debtorSearch) + '".' : 'No hay casas registradas en esta categoría.') +
      '</div>';
    return;
  }

  const maxSaldo = Math.max(...lista.map(item => item.saldo), 1);
  const sortCls = state.debtorSortDir === 'asc' ? ' sort-asc' : state.debtorSortDir === 'desc' ? ' sort-desc' : '';

  wrap.innerHTML =
    '<table>' +
      '<thead><tr><th>Casa</th><th class="num sortable' + sortCls + '" id="thSaldo">Saldo pendiente' +
        '<svg class="sort-icon" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7-7 7 7"/></svg>' +
      '</th></tr></thead>' +
      '<tbody>' +
        lista.map(item => {
          const w = Math.max(item.saldo / maxSaldo * 100, 4);
          return '<tr><td class="casa">' + highlightMatch(item.casa, q) + '</td>' +
            '<td class="saldo">' + formatMoney(item.saldo) + '<span class="saldo-bar" style="width:' + w + '%"></span></td></tr>';
        }).join('') +
      '</tbody>' +
    '</table>';

  const th = document.getElementById('thSaldo');
  if (th){
    th.tabIndex = 0;
    th.addEventListener('click', () => {
      state.debtorSortDir = state.debtorSortDir === 'desc' ? 'asc' : state.debtorSortDir === 'asc' ? null : 'desc';
      renderTable(d);
    });
    th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); th.click(); } });
  }
}

/** Resalta la coincidencia de búsqueda dentro del nombre de la casa. */
function highlightMatch(text, q){
  const safe = esc(text);
  if (!q) return safe;
  const idx = safe.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return safe;
  return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + q.length) + '</mark>' + safe.slice(idx + q.length);
}
